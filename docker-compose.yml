services:
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: /api/v1
      MONGODB_URI: mongodb://mongo:27017/school_mgmt_erp
      CORS_ORIGINS: http://localhost:4200
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
